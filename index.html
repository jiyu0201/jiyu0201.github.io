<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Yu Ji academic homepage">
    <title>Yu Ji / 纪雨</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/index.js" defer></script>
  </head>
  <body data-page="about">
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="index.html">Yu Ji / 纪雨</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="active" href="index.html">About</a>
          <a href="publications.html">Publications</a>
          <a href="patents.html">Patents</a>
          <a href="projects.html">Projects</a>
        </nav>
      </div>
    </header>

    <main class="shell main about-main">
      <section class="profile-layout" aria-live="polite">
        <div class="portrait-frame">
          <img id="profile-photo" alt="Yu Ji portrait" hidden>
          <span id="photo-placeholder">Photo</span>
        </div>

        <article class="profile-content">
          <p class="eyebrow">Academic Homepage</p>
          <h1 id="profile-name">Yu Ji</h1>
          <div id="profile-title" class="title-lines"></div>

          <dl class="contact-grid">
            <div>
              <dt>Email</dt>
              <dd id="profile-email"></dd>
            </div>
            <div>
              <dt>Google Scholar</dt>
              <dd id="profile-scholar"></dd>
            </div>
            <div class="wide">
              <dt>Address</dt>
              <dd id="profile-address"></dd>
            </div>
          </dl>

          <section class="research-block" aria-labelledby="research-heading">
            <h2 id="research-heading">Research Interests</h2>
            <p id="research-interests" class="research-interests"></p>
          </section>

          <div id="profile-bio" class="bio" hidden></div>
        </article>
      </section>

      <section id="collaboration-box" class="collaboration-box" hidden>
        <p id="collaboration-text"></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>&copy; Yu Ji</span>
        <span id="last-updated">Last updated: 2026</span>
      </div>
    </footer>
  </body>
</html>
